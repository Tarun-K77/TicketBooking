spring.application.name=backend
spring.datasource.url=jdbc:sqlite:ticket_booking.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=com.ticketbooking.config.CustomSQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Waitlist Offer TTL (default to 10 mins)
app.waitlist.offer-ttl-minutes=10
# Seat hold TTL (default to 10 mins)
app.seat.hold-ttl-minutes=10

# JWT
jwt.secret=4f6a8b79d2b1f8e5c3a4d9e7b2c5a8f4e6d3c2b1a9f8e7d6c5b4a3f2e1d0c9b8
jwt.expirationMs=86400000

# Mail Configuration (Example)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=example
spring.mail.password=example
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.jackson.serialization.fail-on-empty-beans=false
