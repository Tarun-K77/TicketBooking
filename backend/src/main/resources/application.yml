spring:
  application:
    name: ticket-booking-backend

  # ── Database ──────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketbooking}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway ────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Redis ─────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ── Mail ──────────────────────────────────────
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@ticketbooking.com}

  # ── Jackson ───────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ── JWT Configuration ──────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:default-jwt-secret-change-me-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  # ── Seat Hold ────────────────────────────────
  seat:
    hold-ttl-minutes: ${SEAT_HOLD_TTL_MINUTES:10}

  # ── Waitlist ─────────────────────────────────
  waitlist:
    offer-ttl-minutes: ${WAITLIST_OFFER_TTL_MINUTES:15}

  # ── Ticket Security ─────────────────────────
  ticket:
    hmac-secret: ${HMAC_SECRET_KEY:default-hmac-secret-change-me}

  # ── Frontend URL (for email links) ──────────
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

server:
  port: 8080
